[project]
name = "pudding-track-rater"
version = "0.1.0"
description = "KML 轨迹难度评测器"
requires-python = ">=3.11,<3.13"
dependencies = [
    "dashscope>=1.25.5",
    "fastapi>=0.115.0",
    "fastkml==1.4.0",
    "haversine==2.9.0",
    "httpx>=0.27.0",
    "lxml==6.0.2",
    "numpy>=2.0",
    "opencv-python>=4.12.0",
    "pandas>=2.3.0",
    "pyproj==3.7.2",
    "rdp==0.8",
    "scipy>=1.16.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.17",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[tool.uv]
package = false
